name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    # The sample AppHosts use the Aspire CLI bundle; set it up once before building, otherwise the AppHosts
    # set it up during the build in parallel and race. Keep the version in sync with Aspire.AppHost.Sdk.
    - name: Setup Aspire CLI bundle
      run: dotnet dnx --yes aspire.cli@13.6.0 -- setup --install-path "$HOME/.aspire"
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    #- name: Artifacts
    #  uses: actions/upload-artifact@v2
    #  with:
    #    name: artifacts
    #    path: artifacts/**/*
